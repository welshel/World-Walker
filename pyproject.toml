[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-walker"
version = "0.1.0"
description = "Research pipeline for camera-controlled scene video using an explicit 3D proxy"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0", "imageio>=2.31", "imageio-ffmpeg>=0.4.9", "requests>=2.31"]

[project.optional-dependencies]
report = ["numpy>=1.24", "opencv-python>=4.8"]
gpu = ["torch"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
