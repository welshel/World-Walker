[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-3d-video-pipeline"
version = "0.1.0"
description = "Research prototype for camera-controlled 3D-consistent scene video generation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0", "imageio>=2.31", "imageio-ffmpeg>=0.4.9", "requests>=2.31"]

[project.optional-dependencies]
report = ["numpy>=1.24", "opencv-python>=4.8"]
gpu = ["torch"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
